<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Registro')}"></head>
<body class="bg-light">
<nav th:replace="~{fragments/layout :: navbar(false)}"></nav>
<main class="container py-5">
    <div class="row justify-content-center"><div class="col-12 col-lg-8">
        <section class="card border-0 shadow-sm"><div class="card-body p-4 p-md-5">
            <p class="text-primary fw-semibold mb-2">Nuevo usuario</p>
            <h1 class="h3 mb-4">Crear cuenta</h1>
            <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>
            <form method="post" th:action="@{/registro}" th:object="${registro}">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <div class="row g-3">
                    <div class="col-md-6"><label class="form-label">Nombre</label><input class="form-control" th:field="*{nombre}" required><div class="text-danger small" th:errors="*{nombre}"></div></div>
                    <div class="col-md-6"><label class="form-label">Apellido</label><input class="form-control" th:field="*{apellido}" required><div class="text-danger small" th:errors="*{apellido}"></div></div>
                    <div class="col-md-6"><label class="form-label">Documento</label><input class="form-control" th:field="*{documento}" required><div class="text-danger small" th:errors="*{documento}"></div></div>
                    <div class="col-md-6"><label class="form-label">Fecha de nacimiento</label><input class="form-control" type="date" th:field="*{fechaNacimiento}" required><div class="text-danger small" th:errors="*{fechaNacimiento}"></div></div>
                    <div class="col-12"><label class="form-label">Correo personal</label><input class="form-control" type="email" th:field="*{correoPersonal}" required><div class="text-danger small" th:errors="*{correoPersonal}"></div></div>
                    <div class="col-12"><label class="form-label">Clave</label><input class="form-control" type="password" th:field="*{clave}" minlength="8" required><div class="text-danger small" th:errors="*{clave}"></div></div>
                </div>
                <div class="d-flex justify-content-between align-items-center mt-4"><a th:href="@{/login}">Volver</a><button class="btn btn-primary" type="submit">Registrarme</button></div>
            </form>
        </div></section>
    </div></div>
</main>
</body>
</html>
