<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Ingresar')}"></head>
<body class="bg-light">
<nav th:replace="~{fragments/layout :: navbar(false)}"></nav>
<main class="container py-5">
    <div class="row justify-content-center">
        <div class="col-12 col-md-6 col-lg-5">
            <section class="card border-0 shadow-sm">
                <div class="card-body p-4 p-md-5">
                    <p class="text-primary fw-semibold mb-2">Área segura</p>
                    <h1 class="h3 mb-4">Ingresar al sistema</h1>
                    <div class="alert alert-danger" th:if="${param.error}">Correo o clave incorrectos. Al tercer fallo la cuenta se bloquea.</div>
                    <div class="alert alert-success" th:if="${param.registrado}">Registro exitoso. Ya podés iniciar sesión.</div>
                    <div class="alert alert-info" th:if="${param.logout}">Sesión cerrada correctamente.</div>
                    <form method="post" th:action="@{/login}">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <div class="mb-3">
                            <label class="form-label" for="username">Correo personal</label>
                            <input class="form-control" id="username" name="username" type="email" required autofocus>
                        </div>
                        <div class="mb-4">
                            <label class="form-label" for="password">Clave</label>
                            <input class="form-control" id="password" name="password" type="password" required>
                        </div>
                        <button class="btn btn-primary w-100" type="submit">Ingresar</button>
                    </form>
                    <p class="text-center mt-4 mb-0">¿No tenés una cuenta? <a th:href="@{/registro}">Registrate</a></p>
                </div>
            </section>
        </div>
    </div>
</main>
</body>
</html>
