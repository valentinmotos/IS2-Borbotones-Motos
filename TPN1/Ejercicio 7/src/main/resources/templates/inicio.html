<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Club Borbotones</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head>
<body class="bg-light"><nav class="navbar navbar-dark bg-dark"><div class="container"><span class="navbar-brand fw-bold">CLUB BORBOTONES</span><form method="post" th:action="@{/logout}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="btn btn-outline-light btn-sm">Cerrar sesión</button></form></div></nav><main class="container py-5"><div class="d-flex justify-content-between align-items-center mb-4"><div><p class="text-primary fw-semibold mb-1">Gestión integral</p><h1 class="h2">Socios, accesos y cuotas</h1></div><div class="d-flex gap-2"><a class="btn btn-outline-primary" th:href="@{/socios/nuevo}">Nuevo socio</a><a class="btn btn-primary" th:href="@{/pagos/nuevo}">Registrar pago</a><a class="btn btn-dark" th:href="@{/accesos/nuevo}">Registrar ingreso</a></div></div><section class="card border-0 shadow-sm mb-4"><div class="card-body"><h2 class="h5">Socios y grupos familiares</h2><div class="table-responsive"><table class="table"><thead><tr><th>Documento</th><th>Socio</th><th>Grupo</th><th>Cuota mensual</th></tr></thead><tbody><tr th:each="socio : ${socios}"><td th:text="${socio.documento}"></td><td th:text="${socio.apellido + ', ' + socio.nombre}"></td><td th:text="${socio.grupoFamiliar.nombre}"></td><td th:text="${socio.grupoFamiliar.cuotaMensual}"></td></tr></tbody></table></div></div></section><div class="row g-4"><div class="col-lg-6"><section class="card border-0 shadow-sm h-100"><div class="card-body"><h2 class="h5">Últimos accesos</h2><table class="table table-sm"><thead><tr><th>Socio</th><th>Ingreso</th><th>Egreso</th><th></th></tr></thead><tbody><tr th:each="acceso : ${accesos}"><td th:text="${acceso.socio.nombre}"></td><td th:text="${acceso.ingreso}"></td><td th:text="${acceso.egreso != null ? acceso.egreso : 'Dentro del club'}"></td><td><form th:if="${acceso.egreso == null}" method="post" th:action="@{'/accesos/' + ${acceso.id} + '/egreso}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="btn btn-sm btn-outline-secondary">Egreso</button></form></td></tr></tbody></table></div></section></div><div class="col-lg-6"><section class="card border-0 shadow-sm h-100"><div class="card-body"><h2 class="h5">Pagos de cuota</h2><table class="table table-sm"><thead><tr><th>Grupo</th><th>Importe</th><th>Medio</th><th>Fecha</th></tr></thead><tbody><tr th:each="pago : ${pagos}"><td th:text="${pago.grupoFamiliar.nombre}"></td><td th:text="${pago.importe}"></td><td th:text="${pago.medioPago}"></td><td th:text="${pago.fecha}"></td></tr></tbody></table></div></section></div></div><p class="small text-secondary mt-3">Las entidades del club se auditan con Hibernate Envers.</p></main></body></html>
