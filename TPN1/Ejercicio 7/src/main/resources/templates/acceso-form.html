<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Registrar ingreso</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head><body class="bg-light"><main class="container py-5"><div class="row justify-content-center"><div class="col-md-6"><section class="card border-0 shadow-sm"><div class="card-body p-4"><h1 class="h3 mb-4">Registrar ingreso al club</h1><form method="post" th:action="@{/accesos}" th:object="${acceso}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><label class="form-label">Socio</label><select class="form-select mb-3" th:field="*{socioId}" required><option value="">Seleccionar...</option><option th:each="socio : ${socios}" th:value="${socio.id}" th:text="${socio.apellido + ', ' + socio.nombre}"></option></select><label class="form-label">Imagen facial en Base64 (opcional)</label><textarea class="form-control mb-4" rows="3" th:field="*{imagenBase64}" placeholder="Representación Base64 de la imagen"></textarea><a class="btn btn-link" th:href="@{/inicio}">Cancelar</a><button class="btn btn-primary">Registrar ingreso</button></form></div></section></div></div></main></body></html>
