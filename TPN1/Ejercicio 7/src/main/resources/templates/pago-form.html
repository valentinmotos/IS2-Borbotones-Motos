<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Pago de cuota</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head><body class="bg-light"><main class="container py-5"><div class="row justify-content-center"><div class="col-md-6"><section class="card border-0 shadow-sm"><div class="card-body p-4"><h1 class="h3 mb-4">Registrar pago familiar</h1><form method="post" th:action="@{/pagos}" th:object="${pago}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><label class="form-label">Grupo familiar</label><select class="form-select mb-3" th:field="*{grupoFamiliarId}" required><option value="">Seleccionar...</option><option th:each="grupo : ${grupos}" th:value="${grupo.id}" th:text="${grupo.nombre + ' - $' + grupo.cuotaMensual}"></option></select><label class="form-label">Importe</label><input class="form-control mb-3" type="number" step="0.01" min="0.01" th:field="*{importe}" required><label class="form-label">Medio de pago</label><select class="form-select mb-4" th:field="*{medioPago}" required><option value="">Seleccionar...</option><option th:each="medio : ${medios}" th:value="${medio}" th:text="${medio}"></option></select><a class="btn btn-link" th:href="@{/inicio}">Cancelar</a><button class="btn btn-primary">Registrar pago</button></form></div></section></div></div></main></body></html>
