<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Nuevo socio</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head><body class="bg-light"><main class="container py-5"><div class="row justify-content-center"><div class="col-md-7"><section class="card border-0 shadow-sm"><div class="card-body p-4"><h1 class="h3 mb-4">Registrar socio</h1><form method="post" th:action="@{/socios}" th:object="${socio}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><label class="form-label">Nombre</label><input class="form-control mb-3" th:field="*{nombre}" required><label class="form-label">Apellido</label><input class="form-control mb-3" th:field="*{apellido}" required><label class="form-label">Documento</label><input class="form-control mb-3" th:field="*{documento}" required><label class="form-label">Fecha de nacimiento</label><input class="form-control mb-3" type="date" th:field="*{fechaNacimiento}" required><label class="form-label">Grupo familiar</label><select class="form-select mb-4" th:field="*{grupoFamiliarId}" required><option value="">Seleccionar...</option><option th:each="grupo : ${grupos}" th:value="${grupo.id}" th:text="${grupo.nombre}"></option></select><a class="btn btn-link" th:href="@{/inicio}">Cancelar</a><button class="btn btn-primary">Guardar</button></form></div></section></div></div></main></body></html>
