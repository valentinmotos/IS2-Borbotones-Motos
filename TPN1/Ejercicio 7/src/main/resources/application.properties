spring.application.name=ejercicio-7-club
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ejercicio7?createDatabaseIfNotExist=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.envers.store_data_at_delete=true
spring.thymeleaf.cache=false
server.port=${PORT:8080}
