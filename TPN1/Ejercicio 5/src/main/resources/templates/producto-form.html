<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Producto | Borbotones</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head>
<body class="bg-light"><main class="container py-5"><div class="row justify-content-center"><div class="col-lg-7"><section class="card border-0 shadow-sm"><div class="card-body p-4"><h1 class="h3 mb-4">Nuevo producto</h1><form method="post" th:action="@{/productos}" th:object="${producto}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><div class="mb-3"><label class="form-label">Nombre</label><input class="form-control" th:field="*{nombre}" required></div><div class="mb-3"><label class="form-label">Código</label><input class="form-control" th:field="*{codigo}" required></div><div class="row"><div class="col-md-6 mb-3"><label class="form-label">Precio</label><input class="form-control" type="number" step="0.01" th:field="*{precio}" required></div><div class="col-md-6 mb-3"><label class="form-label">Stock inicial</label><input class="form-control" type="number" min="0" th:field="*{stock}" required></div></div><a class="btn btn-link" th:href="@{/inicio}">Cancelar</a><button class="btn btn-primary">Guardar</button></form></div></section></div></div></main></body></html>
