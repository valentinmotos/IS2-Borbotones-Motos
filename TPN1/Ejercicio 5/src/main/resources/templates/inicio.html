<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Compras | Borbotones</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head>
<body class="bg-light"><nav class="navbar navbar-dark bg-dark"><div class="container"><span class="navbar-brand fw-bold">BORBOTONES TECH</span><form method="post" th:action="@{/logout}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="btn btn-outline-light btn-sm">Cerrar sesión</button></form></div></nav><main class="container py-5"><div class="d-flex justify-content-between align-items-center mb-4"><div><p class="text-primary fw-semibold mb-1">ABM de compras</p><h1 class="h2">Inventario y órdenes</h1></div><div class="d-flex gap-2"><a class="btn btn-outline-primary" th:href="@{/productos/nuevo}">Nuevo producto</a><a class="btn btn-primary" th:href="@{/ordenes/nueva}">Nueva orden</a></div></div><section class="card border-0 shadow-sm mb-4"><div class="card-body"><h2 class="h5">Productos activos</h2><div class="table-responsive"><table class="table align-middle"><thead><tr><th>Código</th><th>Producto</th><th>Precio</th><th>Stock</th></tr></thead><tbody><tr th:each="producto : ${productos}"><td th:text="${producto.codigo}"></td><td th:text="${producto.nombre}"></td><td th:text="${producto.precio}"></td><td th:text="${producto.stock}"></td></tr></tbody></table></div></div></section><section class="card border-0 shadow-sm"><div class="card-body"><h2 class="h5">Órdenes de compra</h2><div class="table-responsive"><table class="table align-middle"><thead><tr><th>Número</th><th>Fecha</th><th>Proveedor</th><th>Estado</th></tr></thead><tbody><tr th:each="orden : ${ordenes}"><td th:text="${orden.numero}"></td><td th:text="${orden.fecha}"></td><td th:text="${orden.proveedor.razonSocial}"></td><td><span class="badge text-bg-warning" th:text="${orden.estado}"></span></td></tr></tbody></table></div></div></section></main></body></html>
