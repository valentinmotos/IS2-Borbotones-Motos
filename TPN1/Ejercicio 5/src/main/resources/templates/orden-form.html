<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Orden | Borbotones</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head>
<body class="bg-light"><main class="container py-5"><div class="row justify-content-center"><div class="col-lg-7"><section class="card border-0 shadow-sm"><div class="card-body p-4"><h1 class="h3 mb-4">Nueva orden de compra</h1><form method="post" th:action="@{/ordenes}" th:object="${orden}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><label class="form-label">Proveedor mayorista</label><select class="form-select mb-3" th:field="*{proveedorId}" required><option value="">Seleccionar...</option><option th:each="proveedor : ${proveedores}" th:value="${proveedor.id}" th:text="${proveedor.razonSocial}"></option></select><label class="form-label">Producto</label><select class="form-select mb-3" th:field="*{productoId}" required><option value="">Seleccionar...</option><option th:each="producto : ${productos}" th:value="${producto.id}" th:text="${producto.nombre + ' - $' + producto.precio}"></option></select><label class="form-label">Cantidad</label><input class="form-control mb-4" type="number" min="1" th:field="*{cantidad}" required><a class="btn btn-link" th:href="@{/inicio}">Cancelar</a><button class="btn btn-primary">Registrar orden</button></form></div></section></div></div></main></body></html>
