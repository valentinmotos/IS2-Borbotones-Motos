<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Registro docente</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head>
<body class="bg-light"><main class="container py-5"><div class="row justify-content-center"><div class="col-lg-8"><section class="card border-0 shadow-sm"><div class="card-body p-4 p-md-5"><h1 class="h3 mb-4">Registrar docente</h1><div class="alert alert-danger" th:if="${error}" th:text="${error}"></div><form method="post" th:action="@{/registro}" th:object="${profesor}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><div class="row g-3"><div class="col-md-6"><label class="form-label">Nombre</label><input class="form-control" th:field="*{nombre}" required></div><div class="col-md-6"><label class="form-label">Apellido</label><input class="form-control" th:field="*{apellido}" required></div><div class="col-md-6"><label class="form-label">Sexo</label><input class="form-control" th:field="*{sexo}" required></div><div class="col-md-6"><label class="form-label">Fecha de nacimiento</label><input class="form-control" type="date" th:field="*{fechaNacimiento}" required></div><div class="col-12"><label class="form-label">Correo personal</label><input class="form-control" type="email" th:field="*{correo}" required></div><div class="col-12"><label class="form-label">Clave</label><input class="form-control" type="password" minlength="8" th:field="*{clave}" required></div></div><div class="mt-4"><a class="btn btn-link" th:href="@{/login}">Volver</a><button class="btn btn-primary">Registrar docente</button></div></form></div></section></div></div></main></body></html>
