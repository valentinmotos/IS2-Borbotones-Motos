<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Acceso docente</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head>
<body class="bg-dark"><main class="container py-5"><div class="row justify-content-center"><div class="col-md-5"><section class="card shadow"><div class="card-body p-5"><p class="text-primary fw-bold">ESCUELA BORBOTONES</p><h1 class="h3 mb-4">Acceso docente</h1><div class="alert alert-danger" th:if="${param.error}">Correo o clave incorrectos.</div><div class="alert alert-success" th:if="${param.registrado}">Docente registrado. Bienvenido al sistema.</div><div class="alert alert-info" th:if="${param.logout}">Sesión cerrada.</div><form method="post" th:action="@{/login}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><label class="form-label">Correo personal</label><input class="form-control mb-3" name="username" type="email" required autofocus><label class="form-label">Clave</label><input class="form-control mb-4" name="password" type="password" required><button class="btn btn-primary w-100">Ingresar</button></form><p class="text-center mt-4 mb-0">¿Nuevo docente? <a th:href="@{/registro}">Registrarse</a></p><p class="small text-secondary mt-3 mb-0">Demo: docente@borbotones.com / Borbotones123</p></div></section></div></div></main></body></html>
