<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Nuevo alumno</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head>
<body class="bg-light"><main class="container py-5"><div class="row justify-content-center"><div class="col-md-7"><section class="card border-0 shadow-sm"><div class="card-body p-4"><h1 class="h3 mb-4">Registrar alumno</h1><div class="alert alert-danger" th:if="${error}" th:text="${error}"></div><form method="post" th:action="@{/alumnos}" th:object="${alumno}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><label class="form-label">Nombre</label><input class="form-control mb-3" th:field="*{nombre}" required><label class="form-label">Apellido</label><input class="form-control mb-3" th:field="*{apellido}" required><label class="form-label">Documento</label><input class="form-control mb-4" th:field="*{documento}" required><label class="form-label">ID del grado</label><input class="form-control mb-4" type="number" min="1" th:field="*{gradoId}" required><a class="btn btn-link" th:href="@{/inicio}">Cancelar</a><button class="btn btn-primary">Guardar alumno</button></form></div></section></div></div></main></body></html>
