<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Gestión escolar</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head>
<body class="bg-light"><nav class="navbar navbar-dark bg-dark"><div class="container"><span class="navbar-brand fw-bold">ESCUELA BORBOTONES</span><div class="d-flex gap-3 align-items-center"><a class="text-white text-decoration-none" th:href="@{/clave}">Cambiar clave</a><form method="post" th:action="@{/logout}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="btn btn-outline-light btn-sm">Cerrar sesión</button></form></div></div></nav><main class="container py-5"><div class="d-flex justify-content-between align-items-center mb-4"><div><p class="text-primary fw-semibold mb-1">Panel docente</p><h1 class="h2">Alumnos y calificaciones</h1></div><a class="btn btn-primary" th:href="@{/alumnos/nuevo}">Registrar alumno</a></div><section class="card border-0 shadow-sm"><div class="card-body"><h2 class="h5">Alumnos registrados</h2><div class="table-responsive"><table class="table align-middle"><thead><tr><th>Documento</th><th>Alumno</th><th>Grado</th><th>Aula</th></tr></thead><tbody><tr th:each="alumno : ${alumnos}"><td th:text="${alumno.documento}"></td><td th:text="${alumno.apellido + ', ' + alumno.nombre}"></td><td th:text="${alumno.grado.nombre}"></td><td th:text="${alumno.grado.aula.nombre}"></td></tr></tbody></table></div></div></section><p class="small text-secondary mt-3">Las entidades se auditan con Hibernate Envers.</p></main></body></html>
