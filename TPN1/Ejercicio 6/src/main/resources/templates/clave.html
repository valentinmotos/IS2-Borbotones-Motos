<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Cambiar clave</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head>
<body class="bg-light"><main class="container py-5"><div class="row justify-content-center"><div class="col-md-6"><section class="card border-0 shadow-sm"><div class="card-body p-4"><h1 class="h3 mb-4">Cambiar clave</h1><div class="alert alert-success" th:if="${mensaje}" th:text="${mensaje}"></div><div class="alert alert-danger" th:if="${error}" th:text="${error}"></div><form method="post" th:action="@{/clave}" th:object="${cambio}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><label class="form-label">Clave actual</label><input class="form-control mb-3" type="password" th:field="*{claveActual}" required><label class="form-label">Nueva clave</label><input class="form-control mb-4" type="password" minlength="8" th:field="*{nuevaClave}" required><a class="btn btn-link" th:href="@{/inicio}">Volver</a><button class="btn btn-primary">Actualizar</button></form></div></section></div></div></main></body></html>
